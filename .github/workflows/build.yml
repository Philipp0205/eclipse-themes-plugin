name: Build and Deploy

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  release:
    types: [created]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Build with Maven
        run: mvn clean verify -B

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: eclipse-themes-updatesite
          path: releng/com.github.eclipsethemes.updatesite/target/repository/
          retention-days: 90

  deploy-updatesite:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'release' || (github.event_name != 'pull_request' && github.ref == 'refs/heads/main')
    concurrency:
      group: updatesite-deploy
      cancel-in-progress: false
    steps:
      - name: Get site extras
        uses: actions/checkout@v5
        with:
          sparse-checkout: releng/com.github.eclipsethemes.updatesite/site-root
          sparse-checkout-cone-mode: true

      - name: Download p2 repository
        uses: actions/download-artifact@v4
        with:
          name: eclipse-themes-updatesite
          path: updatesite/

      - name: Add GitHub Pages files
        run: |
          test -f updatesite/p2.index
          test -d updatesite/plugins
          test -d updatesite/features
          cp -a releng/com.github.eclipsethemes.updatesite/site-root/. updatesite/
          test -f updatesite/index.html
          test -f updatesite/.nojekyll

      - name: Publish p2 repository to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./updatesite
          publish_branch: gh-pages
          force_orphan: true
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
          commit_message: "Publish p2 update site ${{ github.sha }}"

  create-release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: eclipse-themes-updatesite
          path: updatesite/

      - name: Create release archive
        run: |
          cd updatesite
          zip -r ../eclipse-themes-updatesite-${{ github.event.release.tag_name }}.zip .
          cd ..

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: eclipse-themes-updatesite-${{ github.event.release.tag_name }}.zip
